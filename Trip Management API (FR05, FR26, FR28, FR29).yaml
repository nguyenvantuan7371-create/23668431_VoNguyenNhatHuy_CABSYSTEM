openapi: 3.0.0

info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Trip
    description: Trip management, tracking and progress

paths:

  # ============================================================
  # CREATE - Tạo chuyến xe
  # ============================================================
  /rides:
    post:
      summary: Create a new trip
      operationId: createTrip
      tags: [Trip]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'

      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Invalid trip information

        '401':
          description: Unauthorized


    # ============================================================
    # READ ALL - Lấy danh sách chuyến xe
    # ============================================================
    get:
      summary: Get all trips
      operationId: getAllTrips
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ASSIGNED
              - DRIVER_ARRIVING
              - DRIVER_ARRIVED
              - TRIP_STARTED
              - IN_PROGRESS
              - COMPLETED
              - CANCELLED

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Trips retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'

        '401':
          description: Unauthorized


  # ============================================================
  # READ ONE - Lấy thông tin một chuyến xe
  # ============================================================
  /rides/{rideId}:
    get:
      summary: Get trip by ID
      operationId: getTripById
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Trip information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '401':
          description: Unauthorized

        '404':
          description: Trip not found


    # ============================================================
    # UPDATE - Cập nhật thông tin chuyến xe
    # ============================================================
    put:
      summary: Update trip
      operationId: updateTrip
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRideRequest'

      responses:
        '200':
          description: Trip updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Invalid trip information

        '401':
          description: Unauthorized

        '404':
          description: Trip not found


    # ============================================================
    # DELETE - Hủy chuyến xe
    # ============================================================
    delete:
      summary: Cancel trip
      operationId: cancelTrip
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Trip cancelled successfully

        '400':
          description: Trip cannot be cancelled in its current status

        '401':
          description: Unauthorized

        '404':
          description: Trip not found


  # ============================================================
  # TRACKING - Theo dõi tiến trình chuyến xe
  # ============================================================
  /rides/{rideId}/tracking:
    get:
      summary: FR05 - Track ride progress
      operationId: trackRide
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Ride tracking information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideTracking'

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # DRIVER INFORMATION - Thông tin tài xế của chuyến
  # ============================================================
  /rides/{rideId}/driver:
    get:
      summary: FR28 - Get assigned driver information
      operationId: getRideDriver
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Driver information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

        '401':
          description: Unauthorized

        '404':
          description: Ride or driver not found


  # ============================================================
  # UPDATE STATUS - Cập nhật trạng thái chuyến
  # ============================================================
  /rides/{rideId}/status:
    put:
      summary: FR26 - Update trip progress
      operationId: updateRideStatus
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRideStatusRequest'

      responses:
        '200':
          description: Trip status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Invalid status transition

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # COMPLETE TRIP - Hoàn thành chuyến xe
  # ============================================================
  /rides/{rideId}/complete:
    post:
      summary: FR29 - Complete trip
      operationId: completeRide
      tags: [Trip]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Trip completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Trip cannot be completed

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


# ================================================================
# COMPONENTS
# ================================================================
components:

  # ============================================================
  # Authentication
  # ============================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ==========================================================
    # Create Ride Request
    # ==========================================================
    CreateRideRequest:
      type: object

      required:
        - customerId
        - pickupLocation
        - dropoffLocation
        - vehicleType

      properties:
        customerId:
          type: integer
          format: int64

        pickupLocation:
          type: string

        dropoffLocation:
          type: string

        vehicleType:
          type: string


    # ==========================================================
    # Update Ride Request
    # ==========================================================
    UpdateRideRequest:
      type: object

      properties:
        pickupLocation:
          type: string

        dropoffLocation:
          type: string

        vehicleType:
          type: string

        fare:
          type: number
          format: double


    # ==========================================================
    # Update Ride Status Request
    # ==========================================================
    UpdateRideStatusRequest:
      type: object

      required:
        - status

      properties:
        status:
          type: string
          enum:
            - DRIVER_ARRIVING
            - DRIVER_ARRIVED
            - TRIP_STARTED
            - IN_PROGRESS
            - COMPLETED


    # ==========================================================
    # Ride
    # ==========================================================
    Ride:
      type: object

      properties:
        tripId:
          type: integer
          format: int64

        customerId:
          type: integer
          format: int64

        driverId:
          type: integer
          format: int64
          nullable: true

        pickupLocation:
          type: string

        dropoffLocation:
          type: string

        vehicleType:
          type: string

        status:
          type: string
          enum:
            - ASSIGNED
            - DRIVER_ARRIVING
            - DRIVER_ARRIVED
            - TRIP_STARTED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED

        fare:
          type: number
          format: double

        distance:
          type: number
          format: double


    # ==========================================================
    # Driver
    # ==========================================================
    Driver:
      type: object

      properties:
        driverId:
          type: integer
          format: int64

        fullName:
          type: string

        phoneNumber:
          type: string

        currentLocation:
          type: string


    # ==========================================================
    # Ride Tracking
    # ==========================================================
    RideTracking:
      type: object

      properties:
        tripId:
          type: integer
          format: int64

        status:
          type: string

        driverLocation:
          type: string

        estimatedArrivalTime:
          type: string
          format: date-time
