openapi: 3.0.0

info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Notification
    description: Customer and driver notifications

paths:

  # ============================================================
  # CREATE NOTIFICATION
  # ============================================================
  /notifications:
    post:
      summary: Create notification
      operationId: createNotification
      tags: [Notification]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'

      responses:
        '201':
          description: Notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

        '400':
          description: Invalid notification information

        '401':
          description: Unauthorized


    # ============================================================
    # READ ALL NOTIFICATIONS
    # ============================================================
    get:
      summary: Get all notifications
      operationId: getAllNotifications
      tags: [Notification]
      security:
        - bearerAuth: []

      parameters:
        - name: recipientType
          in: query
          required: false
          schema:
            type: string
            enum:
              - CUSTOMER
              - DRIVER

        - name: recipientId
          in: query
          required: false
          schema:
            type: integer
            format: int64

        - name: isRead
          in: query
          required: false
          schema:
            type: boolean

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

        '401':
          description: Unauthorized


  # ============================================================
  # READ CUSTOMER NOTIFICATIONS
  # ============================================================
  /customers/{customerId}/notifications:
    get:
      summary: FR36 - Get customer notifications
      operationId: getCustomerNotifications
      tags: [Notification]
      security:
        - bearerAuth: []

      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int64

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Customer notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

        '401':
          description: Unauthorized

        '404':
          description: Customer not found


  # ============================================================
  # READ DRIVER NOTIFICATIONS
  # ============================================================
  /drivers/{driverId}/notifications:
    get:
      summary: FR37 - Get driver notifications
      operationId: getDriverNotifications
      tags: [Notification]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Driver notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

        '401':
          description: Unauthorized

        '404':
          description: Driver not found


  # ============================================================
  # READ ONE NOTIFICATION
  # ============================================================
  /notifications/{notificationId}:

    get:
      summary: Get notification by ID
      operationId: getNotificationById
      tags: [Notification]
      security:
        - bearerAuth: []

      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Notification information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

        '401':
          description: Unauthorized

        '404':
          description: Notification not found


    # ============================================================
    # UPDATE NOTIFICATION
    # ============================================================
    put:
      summary: Update notification
      operationId: updateNotification
      tags: [Notification]
      security:
        - bearerAuth: []

      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'

      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

        '400':
          description: Invalid notification information

        '401':
          description: Unauthorized

        '404':
          description: Notification not found


    # ============================================================
    # DELETE NOTIFICATION
    # ============================================================
    delete:
      summary: Delete notification
      operationId: deleteNotification
      tags: [Notification]
      security:
        - bearerAuth: []

      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Notification deleted successfully

        '401':
          description: Unauthorized

        '404':
          description: Notification not found


# ================================================================
# COMPONENTS
# ================================================================
components:

  # ============================================================
  # Authentication
  # ============================================================
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ==========================================================
    # Create Notification Request
    # ==========================================================
    CreateNotificationRequest:
      type: object

      required:
        - recipientType
        - recipientId
        - type
        - message

      properties:

        recipientType:
          type: string
          enum:
            - CUSTOMER
            - DRIVER

        recipientId:
          type: integer
          format: int64

        type:
          type: string

        message:
          type: string


    # ==========================================================
    # Update Notification Request
    # ==========================================================
    UpdateNotificationRequest:
      type: object

      properties:

        type:
          type: string

        message:
          type: string

        isRead:
          type: boolean


    # ==========================================================
    # Notification
    # ==========================================================
    Notification:
      type: object

      properties:

        notificationId:
          type: integer
          format: int64

        recipientType:
          type: string
          enum:
            - CUSTOMER
            - DRIVER

        recipientId:
          type: integer
          format: int64

        type:
          type: string

        message:
          type: string

        createdAt:
          type: string
          format: date-time

        isRead:
          type: boolean
