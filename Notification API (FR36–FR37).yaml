openapi: 3.0.0
info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Notification
    description: Customer and driver notifications
paths:
  /customers/{customerId}/notifications:
    get:
      summary: FR36 - Get customer notifications
      operationId: getCustomerNotifications
      tags: [Notification]
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {type: integer, format: int64}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, default: 20}
      responses:
        '200':
          description: Customer notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /drivers/{driverId}/notifications:
    get:
      summary: FR37 - Get driver notifications
      operationId: getDriverNotifications
      tags: [Notification]
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Driver notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Notification:
      type: object
      properties:
        notificationId: {type: integer, format: int64}
        type: {type: string}
        message: {type: string}
        createdAt: {type: string, format: date-time}
        isRead: {type: boolean}
