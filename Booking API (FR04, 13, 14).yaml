openapi: 3.0.0

info:
  title: CAB System API - Booking
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Booking
    description: Ride booking and driver response

paths:

  # ============================================================
  # CREATE - Tạo yêu cầu đặt xe
  # ============================================================
  /rides:
    post:
      summary: FR04 - Create ride booking
      operationId: createRide
      tags: [Booking]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'

      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Invalid booking information

        '401':
          description: Unauthorized


    # ============================================================
    # READ ALL - Lấy danh sách chuyến xe
    # ============================================================
    get:
      summary: Get all rides
      operationId: getAllRides
      tags: [Booking]
      security:
        - bearerAuth: []

      parameters:
        - name: status
          in: query
          required: false
          description: Filter rides by status
          schema:
            type: string
            enum:
              - PENDING
              - ASSIGNED
              - DRIVER_ARRIVING
              - DRIVER_ARRIVED
              - TRIP_STARTED
              - TRIP_IN_PROGRESS
              - TRIP_COMPLETED
              - CANCELLED
              - REJECTED

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          description: Number of rides per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: List of rides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'

        '401':
          description: Unauthorized


  # ============================================================
  # READ ONE - Lấy thông tin một chuyến xe
  # ============================================================
  /rides/{rideId}:

    get:
      summary: Get ride by ID
      operationId: getRideById
      tags: [Booking]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: ID of the ride
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Ride information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


    # ============================================================
    # UPDATE - Cập nhật thông tin chuyến xe
    # ============================================================
    put:
      summary: Update ride booking
      operationId: updateRide
      tags: [Booking]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: ID of the ride
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRideRequest'

      responses:
        '200':
          description: Ride updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Invalid ride information

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


    # ============================================================
    # DELETE - Xóa/hủy yêu cầu đặt xe
    # ============================================================
    delete:
      summary: Cancel ride booking
      operationId: deleteRide
      tags: [Booking]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: ID of the ride
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Ride cancelled successfully

        '400':
          description: Ride cannot be cancelled

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # ACCEPT - Tài xế chấp nhận chuyến
  # ============================================================
  /rides/{rideId}/accept:
    post:
      summary: FR13 - Accept ride request
      operationId: acceptRide
      tags: [Booking]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: ID of the ride
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Ride accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Ride cannot be accepted

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # REJECT - Tài xế từ chối chuyến
  # ============================================================
  /rides/{rideId}/reject:
    post:
      summary: FR14 - Reject ride request
      operationId: rejectRide
      tags: [Booking]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: ID of the ride
          schema:
            type: integer
            format: int64

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRideRequest'

      responses:
        '200':
          description: Ride rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

        '400':
          description: Ride cannot be rejected

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


# ================================================================
# COMPONENTS
# ================================================================
components:

  # ============================================================
  # Authentication
  # ============================================================
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ==========================================================
    # Request - Create
    # ==========================================================
    CreateRideRequest:
      type: object
      required:
        - pickupLocation
        - dropoffLocation
        - vehicleType

      properties:
        pickupLocation:
          type: string
          description: Customer pickup location

        dropoffLocation:
          type: string
          description: Customer destination

        vehicleType:
          type: string
          enum:
            - CAR_4_SEAT
            - CAR_7_SEAT
            - MOTORBIKE


    # ==========================================================
    # Request - Update
    # ==========================================================
    UpdateRideRequest:
      type: object

      properties:
        pickupLocation:
          type: string
          description: Updated pickup location

        dropoffLocation:
          type: string
          description: Updated destination

        vehicleType:
          type: string
          enum:
            - CAR_4_SEAT
            - CAR_7_SEAT
            - MOTORBIKE


    # ==========================================================
    # Request - Reject
    # ==========================================================
    RejectRideRequest:
      type: object

      properties:
        reason:
          type: string
          description: Reason why driver rejects the ride


    # ==========================================================
    # Response - Ride
    # ==========================================================
    Ride:
      type: object

      properties:

        tripId:
          type: integer
          format: int64
          description: Unique trip ID

        customerId:
          type: integer
          format: int64
          description: Customer ID

        driverId:
          type: integer
          format: int64
          nullable: true
          description: Assigned driver ID

        pickupLocation:
          type: string
          description: Pickup location

        dropoffLocation:
          type: string
          description: Destination

        vehicleType:
          type: string
          description: Vehicle type

        status:
          type: string
          enum:
            - PENDING
            - ASSIGNED
            - DRIVER_ARRIVING
            - DRIVER_ARRIVED
            - TRIP_STARTED
            - TRIP_IN_PROGRESS
            - TRIP_COMPLETED
            - CANCELLED
            - REJECTED

        fare:
          type: number
          format: double
          description: Ride fare

        distance:
          type: number
          format: double
          description: Ride distance in kilometers
