openapi: 3.0.0

info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Payment
    description: Fare calculation and payment

paths:

  # ============================================================
  # CREATE PAYMENT
  # ============================================================
  /payments:
    post:
      summary: Create payment
      operationId: createPayment
      tags: [Payment]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'

      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

        '400':
          description: Invalid payment information

        '401':
          description: Unauthorized


    # ============================================================
    # READ ALL PAYMENTS
    # ============================================================
    get:
      summary: Get all payments
      operationId: getAllPayments
      tags: [Payment]
      security:
        - bearerAuth: []

      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - SUCCESS
              - FAILED

        - name: method
          in: query
          required: false
          schema:
            type: string
            enum:
              - CASH
              - ELECTRONIC

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Payments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'

        '401':
          description: Unauthorized


  # ============================================================
  # READ ONE PAYMENT
  # ============================================================
  /payments/{paymentId}:

    get:
      summary: Get payment by ID
      operationId: getPaymentById
      tags: [Payment]
      security:
        - bearerAuth: []

      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

        '401':
          description: Unauthorized

        '404':
          description: Payment not found


    # ============================================================
    # UPDATE PAYMENT
    # ============================================================
    put:
      summary: Update payment
      operationId: updatePayment
      tags: [Payment]
      security:
        - bearerAuth: []

      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'

      responses:
        '200':
          description: Payment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

        '400':
          description: Invalid payment information

        '401':
          description: Unauthorized

        '404':
          description: Payment not found


    # ============================================================
    # DELETE PAYMENT
    # ============================================================
    delete:
      summary: Delete payment
      operationId: deletePayment
      tags: [Payment]
      security:
        - bearerAuth: []

      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Payment deleted successfully

        '400':
          description: Payment cannot be deleted

        '401':
          description: Unauthorized

        '404':
          description: Payment not found


  # ============================================================
  # CALCULATE FARE
  # ============================================================
  /rides/{rideId}/fare:
    post:
      summary: FR30 - Calculate ride fare
      operationId: calculateFare
      tags: [Payment]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Fare calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'

        '400':
          description: Unable to calculate fare

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # CASH PAYMENT
  # ============================================================
  /payments/cash:
    post:
      summary: FR31 - Cash payment
      operationId: payCash
      tags: [Payment]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'

      responses:
        '201':
          description: Cash payment recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

        '400':
          description: Invalid cash payment

        '401':
          description: Unauthorized


  # ============================================================
  # ELECTRONIC PAYMENT
  # ============================================================
  /payments/electronic:
    post:
      summary: FR32 - Electronic payment
      operationId: electronicPayment
      tags: [Payment]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'

      responses:
        '201':
          description: Electronic payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

        '400':
          description: Invalid electronic payment

        '401':
          description: Unauthorized


  # ============================================================
  # PAYMENT PROVIDER
  # ============================================================
  /payments/provider:
    post:
      summary: FR33 - Integrate payment provider
      operationId: sendPaymentToProvider
      tags: [Payment]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPaymentRequest'

      responses:
        '200':
          description: Payment provider accepted request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPaymentResponse'

        '400':
          description: Invalid provider payment request

        '401':
          description: Unauthorized

        '502':
          description: Payment provider error


  # ============================================================
  # RECORD PAYMENT RESULT
  # ============================================================
  /payments/{paymentId}/result:
    post:
      summary: FR34 - Record payment result
      operationId: recordPaymentResult
      tags: [Payment]
      security:
        - bearerAuth: []

      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentResultRequest'

      responses:
        '200':
          description: Payment result recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

        '400':
          description: Invalid payment result

        '401':
          description: Unauthorized

        '404':
          description: Payment not found


  # ============================================================
  # RETRY FAILED PAYMENT
  # ============================================================
  /payments/{paymentId}/retry:
    post:
      summary: FR35 - Retry failed payment
      operationId: retryPayment
      tags: [Payment]
      security:
        - bearerAuth: []

      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Payment retry initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

        '400':
          description: Payment cannot be retried

        '401':
          description: Unauthorized

        '404':
          description: Payment not found


# ================================================================
# COMPONENTS
# ================================================================
components:

  # ============================================================
  # Authentication
  # ============================================================
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ==========================================================
    # Fare Response
    # ==========================================================
    FareResponse:
      type: object

      properties:
        tripId:
          type: integer
          format: int64

        distance:
          type: number
          format: double

        fare:
          type: number
          format: double


    # ==========================================================
    # Payment Request
    # ==========================================================
    PaymentRequest:
      type: object

      required:
        - tripId
        - amount

      properties:
        tripId:
          type: integer
          format: int64

        amount:
          type: number
          format: double


    # ==========================================================
    # Update Payment Request
    # ==========================================================
    UpdatePaymentRequest:
      type: object

      properties:
        amount:
          type: number
          format: double

        method:
          type: string
          enum:
            - CASH
            - ELECTRONIC

        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED


    # ==========================================================
    # Provider Payment Request
    # ==========================================================
    ProviderPaymentRequest:
      type: object

      required:
        - paymentId
        - amount

      properties:
        paymentId:
          type: integer
          format: int64

        amount:
          type: number
          format: double


    # ==========================================================
    # Provider Payment Response
    # ==========================================================
    ProviderPaymentResponse:
      type: object

      properties:
        providerTransactionId:
          type: string

        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED

        paymentUrl:
          type: string
          format: uri


    # ==========================================================
    # Payment Result Request
    # ==========================================================
    PaymentResultRequest:
      type: object

      required:
        - providerTransactionId
        - status

      properties:
        providerTransactionId:
          type: string

        status:
          type: string
          enum:
            - SUCCESS
            - FAILED


    # ==========================================================
    # Payment
    # ==========================================================
    Payment:
      type: object

      properties:
        paymentId:
          type: integer
          format: int64

        tripId:
          type: integer
          format: int64

        method:
          type: string
          enum:
            - CASH
            - ELECTRONIC

        amount:
          type: number
          format: double

        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
