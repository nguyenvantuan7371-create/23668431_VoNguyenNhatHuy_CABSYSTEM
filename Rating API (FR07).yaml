openapi: 3.0.0

info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Rating
    description: Trip rating

paths:

  # ============================================================
  # CREATE - Tạo đánh giá cho chuyến xe
  # ============================================================
  /rides/{rideId}/rating:
    post:
      summary: FR07 - Rate a completed trip
      operationId: rateRide
      tags: [Rating]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'

      responses:
        '201':
          description: Rating recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'

        '400':
          description: Ride is not completed or score is invalid

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


    # ============================================================
    # READ - Lấy đánh giá của một chuyến xe
    # ============================================================
    get:
      summary: Get rating for a ride
      operationId: getRideRating
      tags: [Rating]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Ride rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'

        '401':
          description: Unauthorized

        '404':
          description: Rating not found


  # ============================================================
  # READ ALL - Lấy tất cả đánh giá
  # ============================================================
  /ratings:
    get:
      summary: Get all ratings
      operationId: getAllRatings
      tags: [Rating]
      security:
        - bearerAuth: []

      parameters:
        - name: score
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Ratings retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rating'

        '401':
          description: Unauthorized


  # ============================================================
  # READ ONE - Lấy một đánh giá theo ID
  # ============================================================
  /ratings/{ratingId}:

    get:
      summary: Get rating by ID
      operationId: getRatingById
      tags: [Rating]
      security:
        - bearerAuth: []

      parameters:
        - name: ratingId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Rating information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'

        '401':
          description: Unauthorized

        '404':
          description: Rating not found


    # ============================================================
    # UPDATE - Cập nhật đánh giá
    # ============================================================
    put:
      summary: Update rating
      operationId: updateRating
      tags: [Rating]
      security:
        - bearerAuth: []

      parameters:
        - name: ratingId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'

      responses:
        '200':
          description: Rating updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'

        '400':
          description: Invalid rating information

        '401':
          description: Unauthorized

        '404':
          description: Rating not found


    # ============================================================
    # DELETE - Xóa đánh giá
    # ============================================================
    delete:
      summary: Delete rating
      operationId: deleteRating
      tags: [Rating]
      security:
        - bearerAuth: []

      parameters:
        - name: ratingId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Rating deleted successfully

        '401':
          description: Unauthorized

        '404':
          description: Rating not found


# ================================================================
# COMPONENTS
# ================================================================
components:

  # ============================================================
  # Authentication
  # ============================================================
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ==========================================================
    # Rating Request
    # ==========================================================
    RatingRequest:
      type: object

      required:
        - score

      properties:

        score:
          type: integer
          minimum: 1
          maximum: 5
          description: Rating score from 1 to 5

        comment:
          type: string
          description: Customer comment


    # ==========================================================
    # Rating Response
    # ==========================================================
    Rating:
      type: object

      properties:

        ratingId:
          type: integer
          format: int64

        tripId:
          type: integer
          format: int64

        score:
          type: integer
          minimum: 1
          maximum: 5

        comment:
          type: string
