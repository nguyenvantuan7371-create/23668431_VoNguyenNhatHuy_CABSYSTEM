openapi: 3.0.0

info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Dispatch
    description: Automatic driver finding, ranking and assignment

paths:

  # ============================================================
  # CREATE - Tạo phân công tài xế
  # ============================================================
  /dispatches:
    post:
      summary: FR24 - Create driver assignment
      operationId: createDispatch
      tags: [Dispatch]
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDispatchRequest'

      responses:
        '201':
          description: Driver assignment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

        '400':
          description: Invalid dispatch information

        '401':
          description: Unauthorized


    # ============================================================
    # READ ALL - Lấy danh sách phân công
    # ============================================================
    get:
      summary: Get all dispatch assignments
      operationId: getAllDispatches
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: status
          in: query
          required: false
          description: Filter dispatches by status
          schema:
            type: string
            enum:
              - PENDING
              - SEARCHING
              - ASSIGNED
              - REJECTED
              - TIMEOUT
              - NO_DRIVER
              - CANCELLED

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          description: Number of records per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: List of dispatch assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DispatchResponse'

        '401':
          description: Unauthorized


  # ============================================================
  # READ ONE - Lấy một phân công
  # ============================================================
  /dispatches/{dispatchId}:

    get:
      summary: Get dispatch assignment by ID
      operationId: getDispatchById
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: dispatchId
          in: path
          required: true
          description: Dispatch assignment ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Dispatch assignment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

        '401':
          description: Unauthorized

        '404':
          description: Dispatch assignment not found


    # ============================================================
    # UPDATE - Cập nhật phân công tài xế
    # ============================================================
    put:
      summary: Update driver assignment
      operationId: updateDispatch
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: dispatchId
          in: path
          required: true
          description: Dispatch assignment ID
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDispatchRequest'

      responses:
        '200':
          description: Driver assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

        '400':
          description: Invalid dispatch information

        '401':
          description: Unauthorized

        '404':
          description: Dispatch assignment not found


    # ============================================================
    # DELETE - Hủy phân công
    # ============================================================
    delete:
      summary: Cancel driver assignment
      operationId: deleteDispatch
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: dispatchId
          in: path
          required: true
          description: Dispatch assignment ID
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Dispatch assignment cancelled successfully

        '400':
          description: Dispatch cannot be cancelled

        '401':
          description: Unauthorized

        '404':
          description: Dispatch assignment not found


  # ============================================================
  # FIND AVAILABLE DRIVERS
  # ============================================================
  /rides/{rideId}/drivers:
    get:
      summary: FR17 - Find available drivers
      operationId: findAvailableDrivers
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Ride ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Available drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'

        '401':
          description: Unauthorized

        '404':
          description: No suitable driver found


  # ============================================================
  # RANK DRIVERS
  # ============================================================
  /rides/{rideId}/drivers/ranking:
    get:
      summary: FR18 - Rank suitable drivers
      operationId: rankDrivers
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Ride ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Drivers ranked successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverRanking'

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # RETRY DISPATCH
  # ============================================================
  /rides/{rideId}/dispatch/retry:
    post:
      summary: FR21 - Retry dispatch after driver rejection
      operationId: retryDispatch
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Ride ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Next driver search started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

        '400':
          description: Dispatch retry is not allowed

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # HANDLE TIMEOUT
  # ============================================================
  /rides/{rideId}/dispatch/timeout:
    post:
      summary: FR22 - Handle driver response timeout
      operationId: handleDispatchTimeout
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Ride ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Timeout handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

        '400':
          description: Timeout cannot be handled

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # CHECK DISPATCH STATUS
  # ============================================================
  /rides/{rideId}/dispatch/status:
    get:
      summary: FR23 - Check no-driver dispatch status
      operationId: getDispatchStatus
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Ride ID
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Dispatch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

        '401':
          description: Unauthorized

        '404':
          description: Ride not found


  # ============================================================
  # ASSIGN DRIVER
  # ============================================================
  /rides/{rideId}/assign-driver:
    post:
      summary: FR24 - Assign driver to ride
      operationId: assignDriver
      tags: [Dispatch]
      security:
        - bearerAuth: []

      parameters:
        - name: rideId
          in: path
          required: true
          description: Ride ID
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignDriverRequest'

      responses:
        '200':
          description: Driver assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchResponse'

        '400':
          description: Driver cannot be assigned

        '401':
          description: Unauthorized

        '404':
          description: Ride or driver not found


# ================================================================
# COMPONENTS
# ================================================================
components:

  # ============================================================
  # Authentication
  # ============================================================
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ==========================================================
    # Create Dispatch Request
    # ==========================================================
    CreateDispatchRequest:
      type: object

      required:
        - tripId
        - driverId

      properties:

        tripId:
          type: integer
          format: int64
          description: Ride/Trip ID

        driverId:
          type: integer
          format: int64
          description: Driver ID to assign


    # ==========================================================
    # Update Dispatch Request
    # ==========================================================
    UpdateDispatchRequest:
      type: object

      properties:

        driverId:
          type: integer
          format: int64
          description: New driver ID

        status:
          type: string
          enum:
            - PENDING
            - SEARCHING
            - ASSIGNED
            - REJECTED
            - TIMEOUT
            - NO_DRIVER
            - CANCELLED


    # ==========================================================
    # Driver
    # ==========================================================
    Driver:
      type: object

      properties:

        driverId:
          type: integer
          format: int64

        fullName:
          type: string

        availabilityStatus:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE

        currentLocation:
          type: string


    # ==========================================================
    # Driver Ranking
    # ==========================================================
    DriverRanking:
      type: object

      properties:

        driverId:
          type: integer
          format: int64

        distanceToPickup:
          type: number
          format: double

        rank:
          type: integer


    # ==========================================================
    # Dispatch Response
    # ==========================================================
    DispatchResponse:
      type: object

      properties:

        dispatchId:
          type: integer
          format: int64

        tripId:
          type: integer
          format: int64

        driverId:
          type: integer
          format: int64
          nullable: true

        status:
          type: string

        message:
          type: string


    # ==========================================================
    # Assign Driver Request
    # ==========================================================
    AssignDriverRequest:
      type: object

      required:
        - driverId

      properties:

        driverId:
          type: integer
          format: int64
