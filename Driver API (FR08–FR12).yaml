openapi: 3.0.0

info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Driver
    description: Driver account and vehicle management

paths:

  # ============================================================
  # CREATE DRIVER
  # ============================================================
  /drivers:
    post:
      summary: Create driver
      operationId: createDriver
      tags: [Driver]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDriverRequest'

      responses:
        '201':
          description: Driver created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

        '400':
          description: Invalid driver information

        '409':
          description: Driver already exists


    # ============================================================
    # READ ALL DRIVERS
    # ============================================================
    get:
      summary: Get all drivers
      operationId: getAllDrivers
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: availabilityStatus
          in: query
          required: false
          schema:
            type: string
            enum:
              - AVAILABLE
              - UNAVAILABLE

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Drivers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'

        '401':
          description: Unauthorized


  # ============================================================
  # READ ONE DRIVER
  # ============================================================
  /drivers/{driverId}:

    get:
      summary: Get driver by ID
      operationId: getDriverById
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Driver information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

        '401':
          description: Unauthorized

        '404':
          description: Driver not found


    # ============================================================
    # UPDATE DRIVER
    # ============================================================
    put:
      summary: FR09 - Update driver profile
      operationId: updateDriver
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'

      responses:
        '200':
          description: Driver profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

        '400':
          description: Invalid driver information

        '401':
          description: Unauthorized

        '404':
          description: Driver not found


    # ============================================================
    # DELETE DRIVER
    # ============================================================
    delete:
      summary: Delete driver
      operationId: deleteDriver
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Driver deleted successfully

        '401':
          description: Unauthorized

        '404':
          description: Driver not found


  # ============================================================
  # DRIVER LOGIN
  # ============================================================
  /drivers/login:
    post:
      summary: FR08 - Driver login
      operationId: loginDriver
      tags: [Driver]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '400':
          description: Invalid login request

        '401':
          description: Invalid credentials


  # ============================================================
  # VEHICLE CRUD
  # ============================================================
  /drivers/{driverId}/vehicle:

    # CREATE / UPDATE vehicle
    put:
      summary: FR10 - Manage driver vehicle
      operationId: updateDriverVehicle
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRequest'

      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

        '400':
          description: Invalid vehicle information

        '401':
          description: Unauthorized

        '404':
          description: Driver or vehicle not found


    # READ vehicle
    get:
      summary: Get driver vehicle
      operationId: getDriverVehicle
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Vehicle information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

        '401':
          description: Unauthorized

        '404':
          description: Vehicle not found


    # DELETE vehicle
    delete:
      summary: Delete driver vehicle
      operationId: deleteDriverVehicle
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Vehicle deleted successfully

        '401':
          description: Unauthorized

        '404':
          description: Vehicle not found


  # ============================================================
  # DRIVER AVAILABILITY
  # ============================================================
  /drivers/{driverId}/availability:
    put:
      summary: FR11 - Update driver availability
      operationId: updateDriverAvailability
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'

      responses:
        '200':
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

        '400':
          description: Invalid availability status

        '401':
          description: Unauthorized

        '404':
          description: Driver not found


  # ============================================================
  # DRIVER RIDE REQUESTS
  # ============================================================
  /drivers/{driverId}/ride-requests:
    get:
      summary: FR12 - Get ride requests
      operationId: getDriverRideRequests
      tags: [Driver]
      security:
        - bearerAuth: []

      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Ride requests retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ride'

        '401':
          description: Unauthorized

        '404':
          description: Driver not found


# ================================================================
# COMPONENTS
# ================================================================
components:

  # ============================================================
  # Authentication
  # ============================================================
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # Schemas
  # ============================================================
  schemas:

    # ==========================================================
    # Login Request
    # ==========================================================
    LoginRequest:
      type: object
      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email

        password:
          type: string
          format: password


    # ==========================================================
    # Login Response
    # ==========================================================
    LoginResponse:
      type: object

      properties:
        accessToken:
          type: string

        driverId:
          type: integer
          format: int64


    # ==========================================================
    # Create Driver Request
    # ==========================================================
    CreateDriverRequest:
      type: object

      required:
        - fullName
        - phoneNumber
        - email
        - password

      properties:
        fullName:
          type: string

        phoneNumber:
          type: string

        email:
          type: string
          format: email

        password:
          type: string
          format: password


    # ==========================================================
    # Update Driver Request
    # ==========================================================
    UpdateDriverRequest:
      type: object

      properties:
        fullName:
          type: string

        phoneNumber:
          type: string

        email:
          type: string
          format: email


    # ==========================================================
    # Driver
    # ==========================================================
    Driver:
      type: object

      properties:
        driverId:
          type: integer
          format: int64

        fullName:
          type: string

        phoneNumber:
          type: string

        email:
          type: string
          format: email

        availabilityStatus:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE

        currentLocation:
          type: string


    # ==========================================================
    # Vehicle
    # ==========================================================
    Vehicle:
      type: object

      properties:
        vehicleId:
          type: integer
          format: int64

        driverId:
          type: integer
          format: int64

        licensePlate:
          type: string

        vehicleType:
          type: string
          enum:
            - CAR_4_SEAT
            - CAR_7_SEAT
            - MOTORBIKE

        color:
          type: string


    # ==========================================================
    # Vehicle Request
    # ==========================================================
    VehicleRequest:
      type: object

      required:
        - licensePlate
        - vehicleType

      properties:
        licensePlate:
          type: string

        vehicleType:
          type: string
          enum:
            - CAR_4_SEAT
            - CAR_7_SEAT
            - MOTORBIKE

        color:
          type: string


    # ==========================================================
    # Availability Request
    # ==========================================================
    AvailabilityRequest:
      type: object

      required:
        - availabilityStatus

      properties:
        availabilityStatus:
          type: string
          enum:
            - AVAILABLE
            - UNAVAILABLE


    # ==========================================================
    # Ride
    # ==========================================================
    Ride:
      type: object

      properties:
        tripId:
          type: integer
          format: int64

        pickupLocation:
          type: string

        dropoffLocation:
          type: string

        vehicleType:
          type: string

        status:
          type: string
