openapi: 3.0.0
info:
  title: CAB System - Customer API
  description: API quản lý khách hàng của CAB System – Nền tảng đặt xe.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Customer
    description: Customer account management

paths:

  # ============================================================
  # CREATE - Đăng ký khách hàng
  # ============================================================
  /customers:
    post:
      summary: FR01 - Create a new customer
      operationId: createCustomer
      tags:
        - Customer
      requestBody:
        description: Customer information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid customer information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email or phone number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    # ============================================================
    # READ - Lấy danh sách khách hàng
    # ============================================================
    get:
      summary: Get all customers
      operationId: getCustomers
      tags:
        - Customer
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          description: Number of customers per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: status
          in: query
          required: false
          description: Filter customers by status
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE

      responses:
        '200':
          description: Customers retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  # ============================================================
  # LOGIN - Đăng nhập khách hàng
  # ============================================================
  /customers/login:
    post:
      summary: FR02 - Customer login
      operationId: loginCustomer
      tags:
        - Customer
      requestBody:
        description: Customer login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  # ============================================================
  # READ ONE - Lấy thông tin một khách hàng
  # ============================================================
  /customers/{customerId}:

    get:
      summary: Get customer by ID
      operationId: getCustomerById
      tags:
        - Customer
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Customer retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    # ============================================================
    # UPDATE - Cập nhật khách hàng
    # ============================================================
    put:
      summary: FR03 - Update customer profile
      operationId: updateCustomer
      tags:
        - Customer
      security:
        - bearerAuth: []

      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer
          schema:
            type: integer
            format: int64

      requestBody:
        description: Updated customer information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'

      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

        '400':
          description: Invalid customer information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


    # ============================================================
    # DELETE - Xóa khách hàng
    # ============================================================
    delete:
      summary: Delete customer
      operationId: deleteCustomer
      tags:
        - Customer
      security:
        - bearerAuth: []

      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer
          schema:
            type: integer
            format: int64

      responses:
        '204':
          description: Customer deleted successfully

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


components:

  # ==============================================================
  # SECURITY
  # ==============================================================
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ==============================================================
  # SCHEMAS
  # ==============================================================
  schemas:

    # ------------------------------------------------------------
    # Customer
    # ------------------------------------------------------------
    Customer:
      type: object
      properties:

        customerId:
          type: integer
          format: int64
          example: 1001

        fullName:
          type: string
          example: Nguyen Van A

        phoneNumber:
          type: string
          example: "0901234567"

        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

        status:
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          example: ACTIVE


    # ------------------------------------------------------------
    # Create Customer
    # ------------------------------------------------------------
    CreateCustomerRequest:
      type: object

      required:
        - fullName
        - phoneNumber
        - email
        - password

      properties:

        fullName:
          type: string
          example: Nguyen Van A

        phoneNumber:
          type: string
          example: "0901234567"

        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

        password:
          type: string
          format: password
          example: Password123


    # ------------------------------------------------------------
    # Update Customer
    # ------------------------------------------------------------
    UpdateCustomerRequest:
      type: object

      properties:

        fullName:
          type: string
          example: Nguyen Van B

        phoneNumber:
          type: string
          example: "0912345678"

        email:
          type: string
          format: email
          example: nguyenvanb@gmail.com


    # ------------------------------------------------------------
    # Login Request
    # ------------------------------------------------------------
    LoginRequest:
      type: object

      required:
        - email
        - password

      properties:

        email:
          type: string
          format: email
          example: nguyenvana@gmail.com

        password:
          type: string
          format: password
          example: Password123


    # ------------------------------------------------------------
    # Login Response
    # ------------------------------------------------------------
    LoginResponse:
      type: object

      properties:

        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

        customerId:
          type: integer
          format: int64
          example: 1001


    # ------------------------------------------------------------
    # Error Response
    # ------------------------------------------------------------
    Error:
      type: object

      required:
        - error_code
        - message

      properties:

        error_code:
          type: string
          example: CUSTOMER_NOT_FOUND

        message:
          type: string
          example: Customer not found
