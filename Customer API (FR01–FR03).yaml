openapi: 3.0.0
info:
  title: CAB System API
  description: API for CAB System – Nền tảng đặt xe.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Customer
    description: Customer account management
paths:
  /customers/register:
    post:
      summary: FR01 - Register a new customer
      operationId: registerCustomer
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid registration information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/login:
    post:
      summary: FR02 - Customer login
      operationId: loginCustomer
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customerId}:
    put:
      summary: FR03 - Update customer profile
      operationId: updateCustomer
      tags: [Customer]
      security:
        - bearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          description: Unauthorized
        '404':
          description: Customer not found
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Customer:
      type: object
      properties:
        customerId: {type: integer, format: int64}
        fullName: {type: string}
        phoneNumber: {type: string}
        email: {type: string, format: email}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    CreateCustomerRequest:
      type: object
      required: [fullName, phoneNumber, email, password]
      properties:
        fullName: {type: string}
        phoneNumber: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password}
    UpdateCustomerRequest:
      type: object
      properties:
        fullName: {type: string}
        phoneNumber: {type: string}
        email: {type: string, format: email}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    LoginResponse:
      type: object
      properties:
        accessToken: {type: string}
        customerId: {type: integer, format: int64}
    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code: {type: string}
        message: {type: string}
